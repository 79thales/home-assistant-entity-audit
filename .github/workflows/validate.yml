name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 5 * * 1"

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test frontend integration contract
        run: python -m unittest discover -s tests -v
      - name: Validate Python syntax
        run: python -m compileall -q custom_components/entity_audit
      - name: Validate JavaScript syntax
        run: node --check custom_components/entity_audit/frontend/entity-audit-panel.js
      - name: Test local QR generation and scanning
        run: node tests/test_qrcode.js

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
