name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 5 * * 1"

jobs:
  latest-home-assistant:
    name: Latest stable Home Assistant compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install exact latest stable HA from PyPI
        run: |
          requirement="$(python scripts/latest_ha_requirement.py)"
          python -m pip install "$requirement"
      - name: Run compatibility checks without skipping HA
        run: python -m scripts.check_ha_imports

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test frontend integration contract
        run: python -m unittest discover -s tests -v
      - name: Validate Python syntax
        run: python -m compileall -q custom_components/entity_audit scripts
      - name: Validate JavaScript syntax
        run: node --check custom_components/entity_audit/frontend/entity-audit-panel.js
      - name: Test local QR generation and scanning
        run: node tests/test_qrcode.js

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
